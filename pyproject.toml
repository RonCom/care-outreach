[project]
name = "care-outreach"
version = "0.1.0"
description = "Prescriptive care-management outreach: deep-learning risk model, uplift recommender, budget optimizer, contextual-bandit policy and drift-triggered retraining"
readme = "README.md"
authors = [{ name = "Chris Lavelle" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "evidently>=0.7,<0.8",
    "matplotlib>=3.8",
    "mlflow>=2.16",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "torch>=2.4",
    "zipcodes>=3.0.0",
]

[project.scripts]
care-outreach = "care_outreach.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
